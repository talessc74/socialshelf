name: Cleanup duplicate OAuth connections

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Call cleanup endpoint
        run: |
          curl -s -X POST https://api.radiokactus.com/admin/cleanup-duplicate-connections \
            -H "x-internal-secret: ${{ secrets.INTERNAL_SECRET }}" \
            -H "Content-Type: application/json"
