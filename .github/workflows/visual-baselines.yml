name: Update Visual Baselines

on:
  workflow_dispatch: {}

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9.15.0'

jobs:
  update-baselines:
    name: Generate and commit baseline screenshots
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Generate baselines
        run: pnpm --filter web test:visual:update

      - name: Commit updated baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/web/__snapshots__
          git diff --cached --quiet || git commit -m "chore: update visual regression baselines"
          git push
