name: Deploy

on:
  push:
    branches: [main]

env:
  GCP_PROJECT_ID: socialshelf-547da
  GCP_REGION: us-central1
  ARTIFACT_REGISTRY: us-central1-docker.pkg.dev/socialshelf-547da/socialshelf

jobs:
  bootstrap-iam:
    name: Bootstrap IAM service accounts
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Create service accounts (idempotent)
        run: |
          for SA in api-service publisher-service generator-service; do
            gcloud iam service-accounts create "$SA" \
              --display-name="SocialShelf $SA" \
              --project=${{ env.GCP_PROJECT_ID }} 2>/dev/null || true
          done

      - name: Grant IAM roles (idempotent)
        env:
          DEPLOYER_SA: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        run: |
          PROJECT=${{ env.GCP_PROJECT_ID }}

          # api-service: Firestore + Secret Manager (create + version + read)
          for ROLE in roles/datastore.user roles/secretmanager.admin; do
            gcloud projects add-iam-policy-binding "$PROJECT" \
              --member="serviceAccount:api-service@${PROJECT}.iam.gserviceaccount.com" \
              --role="$ROLE" --condition=None 2>/dev/null || true
          done

          # publisher-service: Firestore + Secret Manager (read + version for token refresh)
          for ROLE in roles/datastore.user roles/secretmanager.admin; do
            gcloud projects add-iam-policy-binding "$PROJECT" \
              --member="serviceAccount:publisher-service@${PROJECT}.iam.gserviceaccount.com" \
              --role="$ROLE" --condition=None 2>/dev/null || true
          done

          # generator-service: Firestore + Vertex AI + Cloud Storage (upload de imagens geradas) +
          # assinatura de URLs (getSignedUrl exige iam.serviceAccounts.signBlob na própria SA)
          for ROLE in roles/datastore.user roles/aiplatform.user roles/storage.objectAdmin roles/iam.serviceAccountTokenCreator; do
            gcloud projects add-iam-policy-binding "$PROJECT" \
              --member="serviceAccount:generator-service@${PROJECT}.iam.gserviceaccount.com" \
              --role="$ROLE" --condition=None 2>/dev/null || true
          done

          # Auto-assinatura (signBlob) exige o binding no próprio recurso da SA, não
          # apenas no projeto — documentado pelo Google para impersonation de service
          # accounts. O binding de projeto acima não habilita getSignedUrl() sozinho.
          # O deployer SA NÃO tem permissão para fazer esse binding (confirmado em
          # produção: PERMISSION_DENIED em iam.serviceAccounts.getIamPolicy sobre o
          # recurso da SA generator-service) — exige iam.serviceAccounts.setIamPolicy
          # na própria SA, que o deployer não detém (Zero Trust, _local-adr-policy-005).
          # Por isso este binding não é tentado em CI; deve ser concedido manualmente
          # uma vez por alguém com acesso de Owner/IAM Admin (ver ADR-010).

          # Grant deployer SA permission to act as app service accounts (project-level)
          # SA-resource-level binding requires iam.serviceAccounts.setIamPolicy which
          # the deployer may not have; project-level binding uses the same permission
          # as the datastore/secretmanager grants above.
          gcloud projects add-iam-policy-binding "$PROJECT" \
            --member="serviceAccount:${DEPLOYER_SA}" \
            --role="roles/iam.serviceAccountUser" \
            --condition=None 2>/dev/null || true

          # Permite ao deployer criar/atualizar o job do Cloud Scheduler que acorda o
          # publisher-service no horário dos posts agendados (ver step "Create/update
          # Cloud Scheduler job" no job deploy-publisher).
          gcloud projects add-iam-policy-binding "$PROJECT" \
            --member="serviceAccount:${DEPLOYER_SA}" \
            --role="roles/cloudscheduler.admin" \
            --condition=None 2>/dev/null || true

          # Firebase Hosting nunca foi implantado neste projeto (ver step "Deploy
          # Firebase Hosting" abaixo) — necessário para o domínio customizado de
          # autenticação (auth.socialshelf.com.br, correção do login Google no Safari).
          # roles/firebasehosting.admin sozinha não bastou: firebase-tools falhou com
          # "Failed to get Firebase project" (run #274) — ele usa a API de gerenciamento
          # do Firebase (firebase.projects.get) antes de qualquer operação de Hosting,
          # e essa permissão só vem em roles/firebase.admin (mais ampla).
          gcloud projects add-iam-policy-binding "$PROJECT" \
            --member="serviceAccount:${DEPLOYER_SA}" \
            --role="roles/firebasehosting.admin" \
            --condition=None 2>/dev/null || true

          gcloud projects add-iam-policy-binding "$PROJECT" \
            --member="serviceAccount:${DEPLOYER_SA}" \
            --role="roles/firebase.admin" \
            --condition=None 2>/dev/null || true

          # roles/cloudscheduler.admin não inclui serviceusage.services.enable — sem
          # isto, "gcloud services enable cloudscheduler.googleapis.com" falha com
          # PERMISSION_DENIED (confirmado em produção nos runs #203 e #204).
          gcloud projects add-iam-policy-binding "$PROJECT" \
            --member="serviceAccount:${DEPLOYER_SA}" \
            --role="roles/serviceusage.serviceUsageAdmin" \
            --condition=None 2>/dev/null || true

          # roles/datastore.owner on the deployer SA is NOT granted here. Per
          # _local-adr-policy-023, it must already be held by the deployer SA —
          # granting project-level IAM via add-iam-policy-binding requires
          # resourcemanager.projects.setIamPolicy, a permission the deployer SA
          # must not hold (Zero Trust / least privilege, _local-adr-policy-005).
          # If Firestore index creation below fails with PERMISSION_DENIED, the
          # role is missing in production and must be granted once, manually, by
          # someone with Owner/IAM Admin access — this is a policy/reality drift,
          # not something CI can or should self-correct.

      # Narração por IA (_local-adr-policy-037) via generator-service. Diferente das APIs de
      # ML "clássicas" do Google (Vision, Translate, Natural Language, Text-to-Speech), não
      # há um role de IAM dedicado documentado para chamar synthesizeSpeech — acesso depende
      # apenas da API estar habilitada no projeto. Se isso se provar insuficiente em produção
      # (PERMISSION_DENIED em generator-service), a permissão exata que falta fica clara no
      # próprio erro, e um binding específico é adicionado então — mesmo padrão de "descobrir
      # em teste real" já usado no restante da integração de vídeo/TikTok.
      - name: Enable Text-to-Speech API
        continue-on-error: true
        run: |
          gcloud services enable texttospeech.googleapis.com --project=${{ env.GCP_PROJECT_ID }} --quiet

      - name: Enable Firebase Management API
        continue-on-error: true
        run: |
          gcloud services enable firebase.googleapis.com --project=${{ env.GCP_PROJECT_ID }} --quiet

      - name: Wait for IAM propagation
        run: |
          echo "Aguardando 60s para o IAM propagar antes dos deploys..."
          sleep 60

      # Diagnóstico temporário: as tentativas anteriores de bootstrap do Firebase
      # Hosting (runs #274-276) falharam com "Failed to get Firebase project" mesmo
      # após conceder roles/firebasehosting.admin e roles/firebase.admin ao deployer
      # SA — mas o self-grant delas roda com "|| true", então uma falha silenciosa
      # de permissão pra conceder essas roles nunca apareceria no log. Este step
      # mostra de fato quais roles o deployer SA tem no projeto agora.
      - name: Debug — listar roles do deployer SA
        env:
          DEPLOYER_SA: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        run: |
          gcloud projects get-iam-policy ${{ env.GCP_PROJECT_ID }} \
            --flatten="bindings[].members" \
            --filter="bindings.members:serviceAccount:${DEPLOYER_SA}" \
            --format="table(bindings.role)"

      # Firebase Hosting nunca tinha sido implantado neste projeto — sem um site de
      # Hosting existente, o Console não permite anexar um domínio customizado (testado
      # via Cowork em 2026-07-12). Este deploy só existe pra criar o site padrão
      # (socialshelf-547da.web.app/.firebaseapp.com) e habilitar o fluxo de "Adicionar
      # domínio personalizado" no Console — o conteúdo publicado (public/index.html)
      # nunca é servido pra usuário real, só o site precisa existir.
      - name: Deploy Firebase Hosting (bootstrap site)
        run: |
          # firebase-tools falhou com "Failed to get Firebase project" usando a
          # credencial ADC padrão (external_account de Workload Identity Federation,
          # runs #274/#275) — provável falta de suporte a esse tipo de credencial no
          # cliente de auth interno do firebase-tools. gcloud lida bem com WIF, então
          # geramos um access token via gcloud e passamos direto, contornando a
          # resolução de credencial própria do firebase-tools.
          TOKEN=$(gcloud auth print-access-token)
          npx --yes firebase-tools@latest deploy --only hosting --project=${{ env.GCP_PROJECT_ID }} --non-interactive --token "$TOKEN"

      - name: Deploy Firestore indexes
        run: |
          # Drives off firestore.indexes.json directly so this step can never drift from
          # the declared indexes again — a hardcoded gcloud call per index went stale
          # repeatedly (newly added indexes, e.g. audience_signals, were never created here).
          jq -c '.indexes[]' firestore.indexes.json | while IFS= read -r idx; do
            collection=$(jq -r '.collectionGroup' <<<"$idx")
            scope=$(jq -r '.queryScope' <<<"$idx")
            mapfile -t field_args < <(jq -r '.fields[] | "--field-config=field-path=\(.fieldPath),order=" + (.order | ascii_downcase)' <<<"$idx")
            echo "Creating index: collection-group=$collection query-scope=$scope ${field_args[*]}"
            gcloud firestore indexes composite create \
              --collection-group="$collection" \
              --query-scope="$scope" \
              "${field_args[@]}" \
              --project=${{ env.GCP_PROJECT_ID }} || true
          done

          gcloud firestore indexes composite list --project=${{ env.GCP_PROJECT_ID }} || true

  deploy-api:
    name: Deploy api-service
    needs: [bootstrap-iam, deploy-publisher, deploy-generator]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push api-service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ env.ARTIFACT_REGISTRY }}/api:${{ github.sha }},${{ env.ARTIFACT_REGISTRY }}/api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy api-service to Cloud Run
        run: |
          # Delimitador trocado de vírgula para ';' (sintaxe --set-env-vars="^;^...") porque
          # CORS_ORIGINS carrega uma lista separada por vírgula (socialshelf.com.br,radiokactus.com) —
          # com o delimitador padrão, gcloud interpreta cada vírgula como um novo par KEY=VALUE e
          # falha com "Bad syntax for dict arg" (visto no run 269/#f5e33a7).
          VARS="FIREBASE_PROJECT_ID=${{ env.GCP_PROJECT_ID }}"
          VARS="${VARS};GCP_PROJECT_ID=${{ env.GCP_PROJECT_ID }}"
          VARS="${VARS};WEB_URL=https://socialshelf.com.br"
          VARS="${VARS};CORS_ORIGINS=https://socialshelf.com.br,https://radiokactus.com"
          VARS="${VARS};X_CLIENT_ID=${{ secrets.X_CLIENT_ID }}"
          VARS="${VARS};X_CLIENT_SECRET=${{ secrets.X_CLIENT_SECRET }}"
          VARS="${VARS};X_REDIRECT_URI=https://api.socialshelf.com.br/oauth/x/callback"
          VARS="${VARS};LINKEDIN_CLIENT_ID=${{ secrets.LINKEDIN_CLIENT_ID }}"
          VARS="${VARS};LINKEDIN_CLIENT_SECRET=${{ secrets.LINKEDIN_CLIENT_SECRET }}"
          VARS="${VARS};LINKEDIN_REDIRECT_URI=https://api.socialshelf.com.br/oauth/linkedin/callback"
          VARS="${VARS};LINKEDIN_PAGE_CLIENT_ID=${{ secrets.LINKEDIN_PAGE_CLIENT_ID }}"
          VARS="${VARS};LINKEDIN_PAGE_CLIENT_SECRET=${{ secrets.LINKEDIN_PAGE_CLIENT_SECRET }}"
          VARS="${VARS};LINKEDIN_PAGE_REDIRECT_URI=https://api.socialshelf.com.br/oauth/linkedin-page/callback"
          VARS="${VARS};META_APP_ID=${{ secrets.META_APP_ID }}"
          VARS="${VARS};META_APP_SECRET=${{ secrets.META_APP_SECRET }}"
          VARS="${VARS};META_REDIRECT_URI=https://api.socialshelf.com.br/oauth/meta/callback"
          VARS="${VARS};TIKTOK_CLIENT_KEY=${{ secrets.TIKTOK_CLIENT_KEY }}"
          VARS="${VARS};TIKTOK_CLIENT_SECRET=${{ secrets.TIKTOK_CLIENT_SECRET }}"
          VARS="${VARS};TIKTOK_REDIRECT_URI=https://api.socialshelf.com.br/oauth/tiktok/callback"
          VARS="${VARS};PUBLISHER_URL=${{ needs.deploy-publisher.outputs.service-url }}"
          VARS="${VARS};GENERATOR_URL=${{ needs.deploy-generator.outputs.service-url }}"
          VARS="${VARS};INTERNAL_SECRET=${{ secrets.INTERNAL_SECRET }}"
          VARS="${VARS};CSRF_SECRET=${{ secrets.CSRF_SECRET }}"
          gcloud run deploy api-service \
            --image=${{ env.ARTIFACT_REGISTRY }}/api:${{ github.sha }} \
            --region=${{ env.GCP_REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --service-account=api-service@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com \
            --set-env-vars="^;^${VARS}" \
            --min-instances=0 \
            --max-instances=3 \
            --memory=512Mi \
            --cpu=1 \
            --timeout=300

  deploy-publisher:
    name: Deploy publisher-service
    needs: [bootstrap-iam, deploy-generator]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      service-url: ${{ steps.deploy.outputs.url }}

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push publisher-service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/publisher/Dockerfile
          push: true
          tags: ${{ env.ARTIFACT_REGISTRY }}/publisher:${{ github.sha }},${{ env.ARTIFACT_REGISTRY }}/publisher:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy publisher-service to Cloud Run
        id: deploy
        run: |
          VARS="FIREBASE_PROJECT_ID=${{ env.GCP_PROJECT_ID }}"
          VARS="${VARS},GCP_PROJECT_ID=${{ env.GCP_PROJECT_ID }}"
          VARS="${VARS},INTERNAL_SECRET=${{ secrets.INTERNAL_SECRET }}"
          VARS="${VARS},CSRF_SECRET=${{ secrets.CSRF_SECRET }}"
          VARS="${VARS},X_CLIENT_ID=${{ secrets.X_CLIENT_ID }}"
          VARS="${VARS},X_CLIENT_SECRET=${{ secrets.X_CLIENT_SECRET }}"
          VARS="${VARS},TIKTOK_CLIENT_KEY=${{ secrets.TIKTOK_CLIENT_KEY }}"
          VARS="${VARS},TIKTOK_CLIENT_SECRET=${{ secrets.TIKTOK_CLIENT_SECRET }}"
          VARS="${VARS},WEB_URL=https://socialshelf.com.br"
          VARS="${VARS},GENERATOR_URL=${{ needs.deploy-generator.outputs.service-url }}"
          gcloud run deploy publisher-service \
            --image=${{ env.ARTIFACT_REGISTRY }}/publisher:${{ github.sha }} \
            --region=${{ env.GCP_REGION }} \
            --platform=managed \
            --no-allow-unauthenticated \
            --service-account=publisher-service@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com \
            --set-env-vars="${VARS}" \
            --min-instances=0 \
            --max-instances=3 \
            --memory=512Mi \
            --cpu=1 \
            --timeout=300

          URL=$(gcloud run services describe publisher-service --region=${{ env.GCP_REGION }} --format='value(status.url)')
          echo "url=${URL}" >> "$GITHUB_OUTPUT"

      - name: Grant api-service invoker access on publisher-service
        run: |
          gcloud run services add-iam-policy-binding publisher-service \
            --region=${{ env.GCP_REGION }} \
            --member="serviceAccount:api-service@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
            --role="roles/run.invoker"

      - name: Grant publisher-service invoker access on itself (used by Cloud Scheduler below)
        run: |
          gcloud run services add-iam-policy-binding publisher-service \
            --region=${{ env.GCP_REGION }} \
            --member="serviceAccount:publisher-service@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
            --role="roles/run.invoker"

      # publisher-service roda com --min-instances=0 e desliga sem tráfego — sem este job,
      # o setInterval em memória só executa enquanto a instância já está de pé por outro
      # motivo, e posts agendados ficam sem ninguém para publicá-los. O Cloud Scheduler
      # acorda o Cloud Run no horário certo via uma chamada HTTP autenticada por OIDC.
      # Não-bloqueante: o deployer SA pode não ter permissão para habilitar a API do
      # Cloud Scheduler (serviceusage.services.enable não está incluída em
      # roles/cloudscheduler.admin nem em roles/serviceusage.serviceUsageAdmin quando o
      # próprio binding desse role falha por falta de resourcemanager.projects.setIamPolicy
      # — mesmo padrão documentado acima para o signBlob do generator-service). Se faltar,
      # requer concessão manual única por um humano com acesso de Owner/IAM Admin no
      # Console. Sem continue-on-error, essa falha bloqueava também o deploy-api-service.
      - name: Create/update Cloud Scheduler job to trigger scheduled posts every minute
        continue-on-error: true
        run: |
          gcloud services enable cloudscheduler.googleapis.com --project=${{ env.GCP_PROJECT_ID }} --quiet

          URL="${{ steps.deploy.outputs.url }}/internal/scheduler-tick"
          SA="publisher-service@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com"

          if gcloud scheduler jobs describe publisher-scheduled-tick --location=${{ env.GCP_REGION }} >/dev/null 2>&1; then
            gcloud scheduler jobs update http publisher-scheduled-tick \
              --location=${{ env.GCP_REGION }} \
              --uri="${URL}" \
              --http-method=POST \
              --update-headers="X-Internal-Secret=${{ secrets.INTERNAL_SECRET }}" \
              --oidc-service-account-email="${SA}" \
              --oidc-token-audience="${{ steps.deploy.outputs.url }}"
          else
            gcloud scheduler jobs create http publisher-scheduled-tick \
              --location=${{ env.GCP_REGION }} \
              --schedule="* * * * *" \
              --uri="${URL}" \
              --http-method=POST \
              --headers="X-Internal-Secret=${{ secrets.INTERNAL_SECRET }}" \
              --oidc-service-account-email="${SA}" \
              --oidc-token-audience="${{ steps.deploy.outputs.url }}"
          fi

      # Fase 4 do roadmap (_local-bdr-plan-002): varre marcas com autonomia semi-automática ou
      # automática e gera (e, quando elegível, publica) até maxAutoPostsPerDay posts por marca,
      # espaçados ao longo do dia (9h-21h Brasília — mesma janela usada pra distribuir os posts
      # de uma campanha). De hora em hora, não mais 1x/dia (_local-edr-policy-038, adendo
      # 2026-07-11) — só assim o teto configurado por marca vira realidade em vez de sempre
      # parar em 1 post/dia; o próprio use-case decide se já é hora do próximo post, então
      # rodar fora da janela comercial é barato (a marca é pulada sem gerar nada). Mesmo padrão
      # non-blocking do job de scheduler acima, pelo mesmo motivo. IMPORTANTE: --schedule
      # precisa estar em ambos os branches (update E create) — um job já existe em produção
      # desde a versão 1x/dia, então só o branch update roda a partir de agora. IMPORTANTE
      # #2: `gcloud scheduler jobs update http` NÃO aceita --headers (só --update-headers) —
      # o flag de create e o de update têm nomes diferentes; usar --headers no branch update
      # falha com "unrecognized arguments" e exit code 2, mascarado pelo continue-on-error
      # (achado real ao confirmar este deploy: o --schedule novo nunca tinha sido aplicado).
      - name: Create/update Cloud Scheduler job for the hourly autonomy tick
        continue-on-error: true
        run: |
          gcloud services enable cloudscheduler.googleapis.com --project=${{ env.GCP_PROJECT_ID }} --quiet

          URL="${{ steps.deploy.outputs.url }}/internal/autonomy-tick"
          SA="publisher-service@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com"

          if gcloud scheduler jobs describe publisher-autonomy-tick --location=${{ env.GCP_REGION }} >/dev/null 2>&1; then
            gcloud scheduler jobs update http publisher-autonomy-tick \
              --location=${{ env.GCP_REGION }} \
              --schedule="0 * * * *" \
              --uri="${URL}" \
              --http-method=POST \
              --update-headers="X-Internal-Secret=${{ secrets.INTERNAL_SECRET }}" \
              --oidc-service-account-email="${SA}" \
              --oidc-token-audience="${{ steps.deploy.outputs.url }}"
          else
            gcloud scheduler jobs create http publisher-autonomy-tick \
              --location=${{ env.GCP_REGION }} \
              --schedule="0 * * * *" \
              --uri="${URL}" \
              --http-method=POST \
              --headers="X-Internal-Secret=${{ secrets.INTERNAL_SECRET }}" \
              --oidc-service-account-email="${SA}" \
              --oidc-token-audience="${{ steps.deploy.outputs.url }}"
          fi

  deploy-generator:
    name: Deploy generator-service
    needs: bootstrap-iam
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      service-url: ${{ steps.deploy.outputs.url }}

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push generator-service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/generator/Dockerfile
          push: true
          tags: ${{ env.ARTIFACT_REGISTRY }}/generator:${{ github.sha }},${{ env.ARTIFACT_REGISTRY }}/generator:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy generator-service to Cloud Run
        id: deploy
        run: |
          VARS="FIREBASE_PROJECT_ID=${{ env.GCP_PROJECT_ID }}"
          VARS="${VARS}#GCP_PROJECT_ID=${{ env.GCP_PROJECT_ID }}"
          VARS="${VARS}#VERTEX_AI_LOCATION=us-central1"
          VARS="${VARS}#GEMINI_LOCATION=global"
          VARS="${VARS}#GEMINI_MODEL=gemini-2.5-flash"
          VARS="${VARS}#IMAGEN_MODEL=imagen-4.0-generate-001"
          VARS="${VARS}#GCS_BUCKET_GENERATED=socialshelf-generated"
          VARS="${VARS}#INTERNAL_SECRET=${{ secrets.INTERNAL_SECRET }}"
          VARS="${VARS}#TRUSTED_NEWS_DOMAINS=reuters.com,apnews.com,afp.com,bbc.com,bbc.co.uk,theguardian.com,nytimes.com,washingtonpost.com,usatoday.com,latimes.com,independent.co.uk,telegraph.co.uk,news.sky.com,abcnews.go.com,cbsnews.com,nbcnews.com,pbs.org,npr.org,aljazeera.com,dw.com,france24.com,euronews.com,scmp.com,japantimes.co.jp,abc.net.au,cbc.ca,wsj.com,ft.com,bloomberg.com,cnbc.com,cnn.com,forbes.com,fortune.com,businessinsider.com,axios.com,economist.com,politico.com,time.com,newsweek.com,vox.com,propublica.org,techcrunch.com,theverge.com,wired.com,arstechnica.com,engadget.com,nature.com,science.org,scientificamerican.com,newscientist.com"
          gcloud run deploy generator-service \
            --image=${{ env.ARTIFACT_REGISTRY }}/generator:${{ github.sha }} \
            --region=${{ env.GCP_REGION }} \
            --platform=managed \
            --no-allow-unauthenticated \
            --set-env-vars="^#^${VARS}" \
            --min-instances=0 \
            --max-instances=2 \
            --memory=1Gi \
            --cpu=1 \
            --timeout=300

          URL=$(gcloud run services describe generator-service --region=${{ env.GCP_REGION }} --format='value(status.url)')
          echo "url=${URL}" >> "$GITHUB_OUTPUT"

      - name: Grant api-service invoker access on generator-service
        run: |
          gcloud run services add-iam-policy-binding generator-service \
            --region=${{ env.GCP_REGION }} \
            --member="serviceAccount:api-service@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
            --role="roles/run.invoker"

      - name: Grant publisher-service invoker access on generator-service
        run: |
          gcloud run services add-iam-policy-binding generator-service \
            --region=${{ env.GCP_REGION }} \
            --member="serviceAccount:publisher-service@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
            --role="roles/run.invoker"

      - name: Grant generator-service invoker access on itself (used by Cloud Scheduler below)
        run: |
          gcloud run services add-iam-policy-binding generator-service \
            --region=${{ env.GCP_REGION }} \
            --member="serviceAccount:generator-service@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
            --role="roles/run.invoker"

      # Retenção de 7 dias para vídeo bruto enviado pelo usuário (_local-edr-policy-034).
      # Uma vez por dia é suficiente — não é um tick de minuto como o de publicação
      # agendada. Mesmo padrão de continue-on-error do job de scheduler do
      # publisher-service acima: a permissão de habilitar a API do Cloud Scheduler pode
      # não estar disponível ao deployer SA, e isso não deve bloquear o resto do deploy.
      - name: Create/update Cloud Scheduler job for daily video cleanup
        continue-on-error: true
        run: |
          gcloud services enable cloudscheduler.googleapis.com --project=${{ env.GCP_PROJECT_ID }} --quiet

          URL="${{ steps.deploy.outputs.url }}/internal/videos-cleanup-tick"
          SA="generator-service@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com"

          if gcloud scheduler jobs describe generator-video-cleanup-tick --location=${{ env.GCP_REGION }} >/dev/null 2>&1; then
            gcloud scheduler jobs update http generator-video-cleanup-tick \
              --location=${{ env.GCP_REGION }} \
              --uri="${URL}" \
              --http-method=POST \
              --update-headers="X-Internal-Secret=${{ secrets.INTERNAL_SECRET }}" \
              --oidc-service-account-email="${SA}" \
              --oidc-token-audience="${{ steps.deploy.outputs.url }}"
          else
            gcloud scheduler jobs create http generator-video-cleanup-tick \
              --location=${{ env.GCP_REGION }} \
              --schedule="0 3 * * *" \
              --uri="${URL}" \
              --http-method=POST \
              --headers="X-Internal-Secret=${{ secrets.INTERNAL_SECRET }}" \
              --oidc-service-account-email="${SA}" \
              --oidc-token-audience="${{ steps.deploy.outputs.url }}"
          fi

  deploy-web:
    name: Deploy web
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ env.ARTIFACT_REGISTRY }}/web:${{ github.sha }},${{ env.ARTIFACT_REGISTRY }}/web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.socialshelf.com.br
            NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
            NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
            NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
            NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
            NEXT_PUBLIC_FIREBASE_APP_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
            NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
            NEXT_PUBLIC_COMMIT_SHA=${{ github.sha }}

      - name: Deploy web to Cloud Run
        run: |
          # API_URL (sem prefixo NEXT_PUBLIC_) é lido em runtime pelo route handler
          # /media/tiktok/[...path] (server-side, nunca exposto ao bundle do cliente) —
          # diferente de NEXT_PUBLIC_API_URL acima, que só existe em build-time.
          gcloud run deploy web-service \
            --image=${{ env.ARTIFACT_REGISTRY }}/web:${{ github.sha }} \
            --region=${{ env.GCP_REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --set-env-vars="API_URL=https://api.socialshelf.com.br" \
            --min-instances=0 \
            --max-instances=3 \
            --memory=512Mi \
            --cpu=1 \
            --timeout=60
