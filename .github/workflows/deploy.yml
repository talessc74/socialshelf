name: Deploy

on:
  push:
    branches: [main]

env:
  GCP_PROJECT_ID: socialshelf-547da
  GCP_REGION: us-central1
  ARTIFACT_REGISTRY: us-central1-docker.pkg.dev/socialshelf-547da/socialshelf

jobs:
  bootstrap-iam:
    name: Bootstrap IAM service accounts
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Create service accounts (idempotent)
        run: |
          for SA in api-service publisher-service generator-service; do
            gcloud iam service-accounts create "$SA" \
              --display-name="SocialShelf $SA" \
              --project=${{ env.GCP_PROJECT_ID }} 2>/dev/null || true
          done

      - name: Grant IAM roles (idempotent)
        env:
          DEPLOYER_SA: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        run: |
          PROJECT=${{ env.GCP_PROJECT_ID }}

          # api-service: Firestore + Secret Manager (create + version + read)
          for ROLE in roles/datastore.user roles/secretmanager.admin; do
            gcloud projects add-iam-policy-binding "$PROJECT" \
              --member="serviceAccount:api-service@${PROJECT}.iam.gserviceaccount.com" \
              --role="$ROLE" --condition=None 2>/dev/null || true
          done

          # publisher-service: Firestore + Secret Manager (read + version for token refresh)
          for ROLE in roles/datastore.user roles/secretmanager.admin; do
            gcloud projects add-iam-policy-binding "$PROJECT" \
              --member="serviceAccount:publisher-service@${PROJECT}.iam.gserviceaccount.com" \
              --role="$ROLE" --condition=None 2>/dev/null || true
          done

          # generator-service: Firestore + Vertex AI + Cloud Storage (upload de imagens geradas) +
          # assinatura de URLs (getSignedUrl exige iam.serviceAccounts.signBlob na própria SA)
          for ROLE in roles/datastore.user roles/aiplatform.user roles/storage.objectAdmin roles/iam.serviceAccountTokenCreator; do
            gcloud projects add-iam-policy-binding "$PROJECT" \
              --member="serviceAccount:generator-service@${PROJECT}.iam.gserviceaccount.com" \
              --role="$ROLE" --condition=None 2>/dev/null || true
          done

          # Auto-assinatura (signBlob) exige o binding no próprio recurso da SA, não
          # apenas no projeto — documentado pelo Google para impersonation de service
          # accounts. O binding de projeto acima não habilita getSignedUrl() sozinho.
          # O deployer SA NÃO tem permissão para fazer esse binding (confirmado em
          # produção: PERMISSION_DENIED em iam.serviceAccounts.getIamPolicy sobre o
          # recurso da SA generator-service) — exige iam.serviceAccounts.setIamPolicy
          # na própria SA, que o deployer não detém (Zero Trust, _local-adr-policy-005).
          # Por isso este binding não é tentado em CI; deve ser concedido manualmente
          # uma vez por alguém com acesso de Owner/IAM Admin (ver ADR-010).

          # Grant deployer SA permission to act as app service accounts (project-level)
          # SA-resource-level binding requires iam.serviceAccounts.setIamPolicy which
          # the deployer may not have; project-level binding uses the same permission
          # as the datastore/secretmanager grants above.
          gcloud projects add-iam-policy-binding "$PROJECT" \
            --member="serviceAccount:${DEPLOYER_SA}" \
            --role="roles/iam.serviceAccountUser" \
            --condition=None 2>/dev/null || true

          # roles/datastore.owner on the deployer SA is NOT granted here. Per
          # _local-adr-policy-023, it must already be held by the deployer SA —
          # granting project-level IAM via add-iam-policy-binding requires
          # resourcemanager.projects.setIamPolicy, a permission the deployer SA
          # must not hold (Zero Trust / least privilege, _local-adr-policy-005).
          # If Firestore index creation below fails with PERMISSION_DENIED, the
          # role is missing in production and must be granted once, manually, by
          # someone with Owner/IAM Admin access — this is a policy/reality drift,
          # not something CI can or should self-correct.

      - name: Wait for IAM propagation
        run: |
          echo "Aguardando 60s para o IAM propagar antes dos deploys..."
          sleep 60

      - name: Deploy Firestore indexes
        run: |
          # Drives off firestore.indexes.json directly so this step can never drift from
          # the declared indexes again — a hardcoded gcloud call per index went stale
          # repeatedly (newly added indexes, e.g. audience_signals, were never created here).
          jq -c '.indexes[]' firestore.indexes.json | while IFS= read -r idx; do
            collection=$(jq -r '.collectionGroup' <<<"$idx")
            scope=$(jq -r '.queryScope' <<<"$idx")
            mapfile -t field_args < <(jq -r '.fields[] | "--field-config=field-path=\(.fieldPath),order=" + (.order | ascii_downcase)' <<<"$idx")
            echo "Creating index: collection-group=$collection query-scope=$scope ${field_args[*]}"
            gcloud firestore indexes composite create \
              --collection-group="$collection" \
              --query-scope="$scope" \
              "${field_args[@]}" \
              --project=${{ env.GCP_PROJECT_ID }} || true
          done

          gcloud firestore indexes composite list --project=${{ env.GCP_PROJECT_ID }} || true

  deploy-api:
    name: Deploy api-service
    needs: [bootstrap-iam, deploy-publisher, deploy-generator]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push api-service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ env.ARTIFACT_REGISTRY }}/api:${{ github.sha }},${{ env.ARTIFACT_REGISTRY }}/api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy api-service to Cloud Run
        run: |
          VARS="FIREBASE_PROJECT_ID=${{ env.GCP_PROJECT_ID }}"
          VARS="${VARS},GCP_PROJECT_ID=${{ env.GCP_PROJECT_ID }}"
          VARS="${VARS},WEB_URL=https://radiokactus.com"
          VARS="${VARS},X_CLIENT_ID=${{ secrets.X_CLIENT_ID }}"
          VARS="${VARS},X_CLIENT_SECRET=${{ secrets.X_CLIENT_SECRET }}"
          VARS="${VARS},X_REDIRECT_URI=https://api.radiokactus.com/oauth/x/callback"
          VARS="${VARS},LINKEDIN_CLIENT_ID=${{ secrets.LINKEDIN_CLIENT_ID }}"
          VARS="${VARS},LINKEDIN_CLIENT_SECRET=${{ secrets.LINKEDIN_CLIENT_SECRET }}"
          VARS="${VARS},LINKEDIN_REDIRECT_URI=https://api.radiokactus.com/oauth/linkedin/callback"
          VARS="${VARS},META_APP_ID=${{ secrets.META_APP_ID }}"
          VARS="${VARS},META_APP_SECRET=${{ secrets.META_APP_SECRET }}"
          VARS="${VARS},META_REDIRECT_URI=https://api.radiokactus.com/oauth/meta/callback"
          VARS="${VARS},PUBLISHER_URL=${{ needs.deploy-publisher.outputs.service-url }}"
          VARS="${VARS},GENERATOR_URL=${{ needs.deploy-generator.outputs.service-url }}"
          VARS="${VARS},INTERNAL_SECRET=${{ secrets.INTERNAL_SECRET }}"
          VARS="${VARS},CSRF_SECRET=${{ secrets.CSRF_SECRET }}"
          gcloud run deploy api-service \
            --image=${{ env.ARTIFACT_REGISTRY }}/api:${{ github.sha }} \
            --region=${{ env.GCP_REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --service-account=api-service@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com \
            --set-env-vars="${VARS}" \
            --min-instances=0 \
            --max-instances=3 \
            --memory=512Mi \
            --cpu=1 \
            --timeout=300

  deploy-publisher:
    name: Deploy publisher-service
    needs: [bootstrap-iam, deploy-generator]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      service-url: ${{ steps.deploy.outputs.url }}

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push publisher-service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/publisher/Dockerfile
          push: true
          tags: ${{ env.ARTIFACT_REGISTRY }}/publisher:${{ github.sha }},${{ env.ARTIFACT_REGISTRY }}/publisher:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy publisher-service to Cloud Run
        id: deploy
        run: |
          VARS="FIREBASE_PROJECT_ID=${{ env.GCP_PROJECT_ID }}"
          VARS="${VARS},GCP_PROJECT_ID=${{ env.GCP_PROJECT_ID }}"
          VARS="${VARS},INTERNAL_SECRET=${{ secrets.INTERNAL_SECRET }}"
          VARS="${VARS},CSRF_SECRET=${{ secrets.CSRF_SECRET }}"
          VARS="${VARS},X_CLIENT_ID=${{ secrets.X_CLIENT_ID }}"
          VARS="${VARS},X_CLIENT_SECRET=${{ secrets.X_CLIENT_SECRET }}"
          VARS="${VARS},GENERATOR_URL=${{ needs.deploy-generator.outputs.service-url }}"
          gcloud run deploy publisher-service \
            --image=${{ env.ARTIFACT_REGISTRY }}/publisher:${{ github.sha }} \
            --region=${{ env.GCP_REGION }} \
            --platform=managed \
            --no-allow-unauthenticated \
            --service-account=publisher-service@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com \
            --set-env-vars="${VARS}" \
            --min-instances=0 \
            --max-instances=3 \
            --memory=512Mi \
            --cpu=1 \
            --timeout=300

          URL=$(gcloud run services describe publisher-service --region=${{ env.GCP_REGION }} --format='value(status.url)')
          echo "url=${URL}" >> "$GITHUB_OUTPUT"

      - name: Grant api-service invoker access on publisher-service
        run: |
          gcloud run services add-iam-policy-binding publisher-service \
            --region=${{ env.GCP_REGION }} \
            --member="serviceAccount:api-service@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
            --role="roles/run.invoker"

  deploy-generator:
    name: Deploy generator-service
    needs: bootstrap-iam
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      service-url: ${{ steps.deploy.outputs.url }}

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push generator-service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/generator/Dockerfile
          push: true
          tags: ${{ env.ARTIFACT_REGISTRY }}/generator:${{ github.sha }},${{ env.ARTIFACT_REGISTRY }}/generator:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy generator-service to Cloud Run
        id: deploy
        run: |
          VARS="FIREBASE_PROJECT_ID=${{ env.GCP_PROJECT_ID }}"
          VARS="${VARS}#GCP_PROJECT_ID=${{ env.GCP_PROJECT_ID }}"
          VARS="${VARS}#VERTEX_AI_LOCATION=us-central1"
          VARS="${VARS}#GEMINI_LOCATION=global"
          VARS="${VARS}#GEMINI_MODEL=gemini-2.5-flash"
          VARS="${VARS}#IMAGEN_MODEL=imagen-4.0-generate-001"
          VARS="${VARS}#GCS_BUCKET_GENERATED=socialshelf-generated"
          VARS="${VARS}#INTERNAL_SECRET=${{ secrets.INTERNAL_SECRET }}"
          VARS="${VARS}#TRUSTED_NEWS_DOMAINS=reuters.com,apnews.com,afp.com,bbc.com,bbc.co.uk,theguardian.com,nytimes.com,washingtonpost.com,usatoday.com,latimes.com,independent.co.uk,telegraph.co.uk,news.sky.com,abcnews.go.com,cbsnews.com,nbcnews.com,pbs.org,npr.org,aljazeera.com,dw.com,france24.com,euronews.com,scmp.com,japantimes.co.jp,abc.net.au,cbc.ca,wsj.com,ft.com,bloomberg.com,cnbc.com,cnn.com,forbes.com,fortune.com,businessinsider.com,axios.com,economist.com,politico.com,time.com,newsweek.com,vox.com,propublica.org,techcrunch.com,theverge.com,wired.com,arstechnica.com,engadget.com,nature.com,science.org,scientificamerican.com,newscientist.com"
          gcloud run deploy generator-service \
            --image=${{ env.ARTIFACT_REGISTRY }}/generator:${{ github.sha }} \
            --region=${{ env.GCP_REGION }} \
            --platform=managed \
            --no-allow-unauthenticated \
            --set-env-vars="^#^${VARS}" \
            --min-instances=0 \
            --max-instances=2 \
            --memory=1Gi \
            --cpu=1 \
            --timeout=300

          URL=$(gcloud run services describe generator-service --region=${{ env.GCP_REGION }} --format='value(status.url)')
          echo "url=${URL}" >> "$GITHUB_OUTPUT"

      - name: Grant api-service invoker access on generator-service
        run: |
          gcloud run services add-iam-policy-binding generator-service \
            --region=${{ env.GCP_REGION }} \
            --member="serviceAccount:api-service@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
            --role="roles/run.invoker"

      - name: Grant publisher-service invoker access on generator-service
        run: |
          gcloud run services add-iam-policy-binding generator-service \
            --region=${{ env.GCP_REGION }} \
            --member="serviceAccount:publisher-service@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
            --role="roles/run.invoker"

  deploy-web:
    name: Deploy web
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ env.ARTIFACT_REGISTRY }}/web:${{ github.sha }},${{ env.ARTIFACT_REGISTRY }}/web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.radiokactus.com
            NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
            NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
            NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
            NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
            NEXT_PUBLIC_FIREBASE_APP_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
            NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
            NEXT_PUBLIC_COMMIT_SHA=${{ github.sha }}

      - name: Deploy web to Cloud Run
        run: |
          gcloud run deploy web-service \
            --image=${{ env.ARTIFACT_REGISTRY }}/web:${{ github.sha }} \
            --region=${{ env.GCP_REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --min-instances=0 \
            --max-instances=3 \
            --memory=512Mi \
            --cpu=1 \
            --timeout=30
